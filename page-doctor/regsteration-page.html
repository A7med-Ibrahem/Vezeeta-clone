<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>حجز موعد - فيزيتا ستايل</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Cairo", sans-serif;
        background-color: #f9fafc;
        padding: 20px;
      }

      .booking-card {
        background-color: #fff;
        border-radius: 12px;
        padding: 30px;
        max-width: 700px;
        margin: auto;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.08);
      }

      .booking-header {
        background-color: #0070cd;
        color: white;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
      }

      .info-section {
        background-color: #f2f6fa;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        font-size: 15px;
      }

      .info-icons img {
        height: 32px;
      }

      .info-values {
        font-weight: 600;
        color: #333;
      }

      .form-section label {
        font-weight: 600;
        color: #444;
        margin-bottom: 5px;
      }

      .form-section input,
      .form-section select {
        border-radius: 8px;
        padding: 10px;
        border: 1px solid #ccc;
      }

      .form-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
      }

      .btn-cancel {
        background-color: #ccc;
        color: #333;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
      }

      .btn-submit {
        background-color: #e73f3f;
        color: white;
        border: none;
        padding: 10px 30px;
        border-radius: 8px;
      }

      .text-blue {
        color: #0070cd;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="booking-card">
      <div class="booking-header">معلومات الحجز</div>

      <div class="text-center mb-3">
        <p class="mb-1 text-blue">كشف طبي</p>
        <a href="#" class="text-decoration-none">احجز</a>
      </div>

      <!-- معلومات الكشف -->
      <div class="info-section text-center">
        <div class="row align-items-center mb-2 info-icons">
          <div class="col-4">
            <img
              src="https://e7.pngegg.com/pngimages/287/501/png-clipart-computer-icons-software-testing-health-care-medical-test-medical-records-angle-text.png"
              alt="كشف"
            />
          </div>
          <div class="col-4">
            <img
              src="https://d1aovdz1i2nnak.cloudfront.net/vezeeta-web-reactjs/jenkins-24/images/V-Cash.svg"
              alt="نقاط"
            />
          </div>
          <div class="col-4">
            <img
              src="https://d1aovdz1i2nnak.cloudfront.net/vezeeta-web-reactjs/jenkins-24/images/waiting-time-green.png"
              alt="انتظار"
            />
          </div>
        </div>
        <div class="row text-center info-values">
          <div class="col-4">الكشف ٦٠٠ جنيه</div>
          <div class="col-4">ستحصل على 600 نقطة</div>
          <div class="col-4">مدة الانتظار: ساعة و ١٠ دقائق</div>
        </div>
      </div>

      <!-- نموذج البيانات -->
      <div class="form-section">
        <h5 class="mb-3">ادخل بيانات الحجز</h5>

        <div class="mb-3">
          <label for="patientName">اسم المريض</label>
          <input
            type="text"
            class="form-control"
            id="patientName"
            placeholder="ادخل الاسم"
          />
        </div>

        <div class="mb-3">
          <label for="phone">رقم الموبايل</label>
          <input
            type="tel"
            class="form-control"
            id="phone"
            placeholder="ادخل رقم الهاتف"
          />
        </div>

        <div class="mb-3">
          <label for="email">البريد الإلكتروني (اختياري)</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="example@email.com"
          />
        </div>

        <div class="form-buttons">
          <button class="btn-cancel" onclick="cancelBooking()">إلغاء</button>
          <button class="btn-submit" onclick="submitBooking()">احجز</button>
        </div>
      </div>
    </div>

    <script>
      function submitBooking() {
        const name = document.getElementById("patientName").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();

        const nameRegex = /^[\u0600-\u06FFa-zA-Z\s]+$/;
        const phoneRegex = /^[0-9]{10,15}$/;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (name === "" || phone === "") {
          alert("من فضلك أدخل الاسم ورقم الموبايل.");
          return;
        }

        if (!nameRegex.test(name)) {
          alert("الاسم يجب أن يحتوي على حروف فقط.");
          return;
        }

        if (!/^\d{11,}$/.test(phone)) {
          alert("رقم الهاتف يجب أن يحتوي على 11 رقم على الأقل.");
          return;
        }

        if (email !== "" && !emailRegex.test(email)) {
          alert("من فضلك أدخل بريد إلكتروني صحيح.");
          return;
        }

        // حفظ البيانات في localStorage
        localStorage.setItem("patientName", name);
        localStorage.setItem("patientPhone", phone);
        localStorage.setItem("patientEmail", email);

        // الانتقال لصفحة التأكيد
        window.location.href = "regestered-page.html";
      }
    </script>
  </body>
</html>
